<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>DeadlockBehavior Inspector V04</title>
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <div class="shell">
    <header class="topbar">
      <div class="brand"><span class="brand-mark">DB</span><div><strong>DeadlockBehavior</strong><small>Research Inspector V04</small></div></div>
      <div class="top-controls">
        <label>Replay<select id="replaySelect"></select></label>
        <label>Player<select id="playerSelect"></select></label>
        <button id="refreshBtn" class="ghost">Rebuild cache</button>
        <button id="importBtn" class="primary">Import .dem</button>
        <input id="replayFile" type="file" accept=".dem" hidden />
      </div>
    </header>

    <section class="timeline-bar">
      <div class="time-readout"><span id="timeClock">0:00.000</span><small id="tickReadout">tick —</small></div>
      <input id="timeSlider" type="range" min="0" max="1" value="0" step="0.25" />
      <button id="jumpLive" class="ghost compact">End</button>
    </section>

    <nav id="tabs" class="tabs"></nav>
    <main id="main" class="main"><div class="loading">Select a replay…</div></main>
  </div>

  <aside id="drawer" class="drawer" aria-hidden="true">
    <div class="drawer-head"><div><small>EVIDENCE</small><h2 id="drawerTitle">Evidence</h2><p id="drawerSubtitle"></p></div><button id="closeDrawer" class="icon-btn">×</button></div>
    <div id="drawerBody" class="drawer-body"></div>
    <div class="drawer-foot"><button id="prevEvidence" class="ghost">Previous</button><span id="evidencePage"></span><button id="nextEvidence" class="ghost">Next</button></div>
  </aside>
  <div id="scrim" class="scrim"></div>
  <div id="toast" class="toast"></div>
  <script type="module" src="/app.js"></script>
  <script type="module" src="/authoritative.js"></script>
</body>
</html>
